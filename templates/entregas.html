<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Entregas</title>
    <!-- Cargamos Leaflet (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        #map { height: 500px; width: 100%; border: 2px solid #ccc; margin-top: 20px; }
        .formulario { background: #f4f4f4; padding: 15px; border-radius: 5px; max-width: 400px; }
    </style>
</head>
<body>
    <h2>Repartidor - Entregas Pendientes</h2>
    
    <!-- Formulario para agregar desde la oficina -->
    <div class="formulario">
        <h3>Agregar nueva entrega (Oficina)</h3>
        <input type="text" id="direccion" placeholder="Dirección (Ej: Bolivar 1334)" required>
        <input type="text" id="destinatario" placeholder="Destinatario / Cliente" required>
        <button onclick="agregarEntrega()">Guardar Entrega</button>
    </div>

    <!-- Aquí se dibuja el mapa -->
    <div id="map"></div>

        <script>
        // Inicializamos el mapa centrado en Corrientes Capital
        const map = L.map('map').setView([-27.4692, -58.8306], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let marcadores = [];

        // Creamos un ícono lindo de entregas
        const iconoEntrega = L.divIcon({
            html: '<div style="font-size: 24px; text-shadow: 1px 1px 2px black;">🛵</div>',
            className: 'custom-icon',
            iconSize: [30, 30],
            iconAnchor: [15, 15]
        });

        async function cargarEntregas(moverMapaA = null) {
            const response = await fetch('/api/entregas');
            const entregas = await response.json();
            
            marcadores.forEach(m => map.removeLayer(m));
            marcadores = [];

            let bounds = L.latLngBounds(); // Para calcular el zoom

            entregas.forEach(entrega => {
                if (entrega.latitud && entrega.longitud) {
                    const marker = L.marker([entrega.latitud, entrega.longitud], {icon: iconoEntrega}).addTo(map);
                    marker.bindPopup(`<b>🛵 ${entrega.destinatario}</b><br>📍 ${entrega.direccion}`);
                    marcadores.push(marker);
                    bounds.extend([entrega.latitud, entrega.longitud]);

                    // Si esta entrega es la que acabamos de guardar, centramos el mapa ahí
                    if (moverMapaA && moverMapaA === entrega.destinatario) {
                        map.setView([entrega.latitud, entrega.longitud], 16); // Zoom 16
                        marker.openPopup(); // Abrimos el cartelito
                    }
                }
            });
            
            // Si no hay que centrar en ninguna, que el mapa encuadre todos los pines
            if (!moverMapaA && marcadores.length > 0) {
                map.fitBounds(bounds, {padding: [50, 50]});
            }
        }

        async function agregarEntrega() {
            const dir = document.getElementById('direccion').value;
            const dest = document.getElementById('destinatario').value;
            
            if (!dir || !dest) return alert("Completa ambos campos");

            const btn = document.querySelector('button');
            btn.innerText = "Buscando en el mapa...";
            btn.disabled = true;

            try {
                const response = await fetch('/api/entregas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ direccion: dir, destinatario: dest })
                });
                
                const result = await response.json();

                document.getElementById('direccion').value = '';
                document.getElementById('destinatario').value = '';
                
                if (result.encontrado === false) {
                    alert("⚠️ La entrega se guardó, pero no se encontró la dirección exacta en el mapa.");
                    cargarEntregas(); // Recarga sin mover el mapa
                } else {
                    // ¡Acá está la magia! Le pasamos el nombre para que vuele hacia ese pin
                    cargarEntregas(dest); 
                }
                
            } catch (error) {
                alert("Hubo un error al guardar.");
                console.error(error);
            } finally {
                btn.innerText = "Guardar Entrega";
                btn.disabled = false;
            }
        }

        // Cargar al iniciar
        cargarEntregas();
    </script>
</body>
</html>
